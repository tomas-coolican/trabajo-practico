<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rick and Morty - Personajes</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="styles/global.css" />
</head>
<body>
  <header class="header hero">
    <div class="container hero__content">
      <p class="hero__eyebrow">Sistema de exploracion interdimensional</p>
      <h1 class="header__title hero__logo-title">
        <img class="hero__logo" src="assets/rick-and-morty-logo.png" alt="Rick and Morty" />
      </h1>
      <p class="header__subtitle">Multiverse Explorer</p>
      <p class="hero__intro">
        Explora personajes, realidades y ubicaciones conectadas por la API publica de Rick and Morty.
      </p>
      <div class="hero__stats" aria-label="Estadisticas del universo">
        <div class="hero__stat">
          <strong>826</strong>
          <span>Personajes</span>
        </div>
        <div class="hero__stat">
          <strong>126</strong>
          <span>Ubicaciones</span>
        </div>
        <div class="hero__stat">
          <strong>86</strong>
          <span>Episodios</span>
        </div>
        <div class="hero__stat">
          <strong>51</strong>
          <span>Especies</span>
        </div>
      </div>
      <a class="hero__scroll" href="#explorer">Iniciar busqueda</a>
    </div>
  </header>

  <main class="container" id="explorer">
    <section class="controls">
      <input type="text" id="search" class="input" placeholder="Buscar personaje..." />
      <select id="status-filter" class="select">
        <option value="">Todos los estados</option>
        <option value="alive">Vivo</option>
        <option value="dead">Muerto</option>
        <option value="unknown">Desconocido</option>
      </select>
      <button id="sort-toggle" class="btn btn--secondary">Ordenar A-Z</button>
      <button id="favorites-toggle" class="btn btn--secondary">★ Favoritos</button>
    </section>

    <div id="status-message" class="status-message"></div>
    <div id="character-grid" class="grid"></div>
    <div id="pagination" class="pagination"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>TP2 — Rick and Morty API</p>
    </div>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
